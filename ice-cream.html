<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icy Delights</title>
    <style>
        #flavour{
            padding: 15px;
            margin: 5px;
            border-radius: 15px;
            display: inline-block;
            width: 200px;
            height: 25px;
            text-align: center;
            box-shadow: black 5px 5px;
        }
        #flavour:hover{
            box-shadow: black 0px 0px;
            transform: translateX(5px) translateY(5px);
        }
        h2{
            font-family:cursive;
            font-size: 40px;
            text-decoration: underline;
        }
        .flavours{
            background-color: lemonchiffon;
            padding: 20px ;
            border-radius: 30px;
            text-align: center;
        }
        h1{
        font-family: cursive;
        font-size: 60px;
        color: rgb(34, 202, 202);
        text-align: center;
        }
        h1+p{
            color: darkcyan;
            font-size: 20px;
            font-family: cursive;
            text-align: center;
        }
        body{
            background-color: rgb(251, 245, 162);
        }
    </style>
</head>
<body>
    <h1>Icy Delights</h1>
    <p>A wide range of ice-cream flavours. Choose your favorite or try something else today!</p>
    <section class="flavours">
    <h2>Flavours</h2>
    <p id="flavour" style="background-color: aliceblue">Vanilla</p>
    <p id="flavour" style="background-color: rgb(163, 80, 21)">Chocolate</p>
    <p id="flavour" style="background-color: rgb(226, 110, 110);">Strawberry</p>
    <p id="flavour" style="background-color: rgb(255, 170, 0);">Mango</p>
    <p id="flavour" style="background-color: lightgreen">Pistachio</p>
    <p id="flavour" style="background-color: rgb(110, 248, 59); color: rgb(82, 82, 82);">Mint Chocolate</p>
    <p id="flavour" style="background-color: rgb(71, 71, 71); color: white;">Cookies n' Cream</p>
    <p id="flavour" style="background-color: rgb(248, 198, 90);">Cookie Dough</p>
    <p id="flavour" style="background-color: rgb(154, 77, 15);">Rocky Road</p>
    <p id="flavour" style="background-color: rgb(3, 174, 231);">Bubble Gum</p>
    <p id="flavour" style="background-color: rgb(240, 224, 4);">Lemon sorbet</p>
    <p id="flavour" style="background-color: rgb(47, 31, 20);color:white;">Stracciatella</p>
    </section>
</body>
</html>
